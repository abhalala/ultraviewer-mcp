[package]
name = "ultraviewer-mcp"
version = "0.1.0"
edition = "2021"
description = "Headless UltraViewer-compatible computer-use MCP server"
license = "MIT"

[lib]
name = "ultraviewer_core"
path = "src/lib.rs"

[[bin]]
name = "ultraviewer-mcp"
path = "src/main.rs"

[features]
default = []
desktop = ["dep:arboard", "dep:cpal", "dep:winit"]

[dependencies]
aes = "0.8"
arboard = { version = "3", optional = true }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
cpal = { version = "0.15", optional = true }
des = "0.8"
getrandom = "0.3"
jpeg-decoder = { version = "0.3", default-features = false }
md-5 = "0.10"
png = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
unicode-normalization = "0.1"
webpki-roots = "1"
winit = { version = "0.30", optional = true }
zstd-safe = { version = "7", features = ["experimental", "std"] }

[profile.release]
lto = "thin"
